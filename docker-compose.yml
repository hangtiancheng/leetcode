services:
  playground:
    build: .
    image: playground:latest
    container_name: playground
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/playground.db"
      # VITE_SENTRY_DSN: ""
    volumes:
      - playground-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  playground-data:
